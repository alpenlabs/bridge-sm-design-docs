name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel outdated runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc: ['9.12.2']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'

      - name: Configure Cabal
        run: |
          cabal configure --enable-tests --test-show-details=direct
          cabal update

      - name: Cache Cabal dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: cabal-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.freeze') }}
          restore-keys: |
            cabal-${{ runner.os }}-${{ matrix.ghc }}-

      - name: Install dependencies
        run: cabal build --only-dependencies all

      - name: Build
        run: cabal build all

  hlint:
    name: HLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.2'
          cabal-version: 'latest'

      - name: Cache HLint
        uses: actions/cache@v4
        with:
          path: ~/.cabal/bin/hlint
          key: hlint-${{ runner.os }}-${{ hashFiles('.hlint.yaml') }}

      - name: Install HLint
        run: |
          if [ ! -f ~/.cabal/bin/hlint ]; then
            cabal install hlint --install-method=copy --installdir=$HOME/.cabal/bin
          fi
          echo "$HOME/.cabal/bin" >> $GITHUB_PATH

      - name: Run HLint
        run: hlint src/ test/ --report

  fourmolu:
    name: Fourmolu Format Check
    runs-on: ubuntu-latest
    env:
      FOURMOLU_VERSION: '0.20.0.0'
      GHC_VERSION: '9.12.2'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: 'latest'

      - name: Cache Fourmolu
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/bin/fourmolu
            ${{ steps.setup.outputs.cabal-store }}
          key: fourmolu-${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-${{ env.FOURMOLU_VERSION }}

      - name: Install Fourmolu
        run: |
          mkdir -p "$HOME/.cabal/bin"
          export PATH="$HOME/.cabal/bin:$PATH"
          if ! command -v fourmolu >/dev/null || ! fourmolu --version | grep -q "fourmolu ${FOURMOLU_VERSION}"; then
            cabal update
            cabal install "fourmolu-${FOURMOLU_VERSION}" --install-method=copy --installdir="$HOME/.cabal/bin" --overwrite-policy=always
          fi
          echo "$HOME/.cabal/bin" >> "$GITHUB_PATH"

      - name: Run Fourmolu
        run: |
          fourmolu --version
          fourmolu --mode check src/ test/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        ghc: ['9.12.2']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'

      - name: Configure Cabal
        run: |
          cabal configure --enable-tests --test-show-details=streaming
          cabal update

      - name: Cache Cabal dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: cabal-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.freeze') }}
          restore-keys: |
            cabal-${{ runner.os }}-${{ matrix.ghc }}-

      - name: Install dependencies
        run: cabal build --only-dependencies all

      - name: Run tests
        run: cabal test all --test-show-details=streaming
